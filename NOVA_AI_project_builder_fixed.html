<script type="text/plain" data-path="nova-ai/src/types/nova.ts">
export type ProviderId = "gemini";

export interface ModelOption {
  id: string;
  name: string;
  provider: ProviderId;
  description: string;
  badge?: string;
  supportsSearch: boolean;
  supportsMultimodal: boolean;
}

export interface AttachmentPayload {
  id: string;
  name: string;
  mimeType: string;
  size: number;
  content: string;
  kind: "text" | "binary";
}

export interface Citation {
  title: string;
  uri: string;
}

export interface AgentStep {
  id: string;
  stage: "planning" | "tool_call" | "tool_result" | "synthesizing" | "confirmation";
  label: string;
  detail?: string;
  toolName?: string;
  status: "running" | "done" | "error" | "waiting_confirmation";
  timestamp: number;
}

export interface PendingConfirmation {
  id: string;
  toolName: string;
  actionTitle: string;
  actionDescription: string;
  args: Record<string, unknown>;
}

export interface ChatMessage {
  id: string;
  role: "user" | "assistant";
  content: string;
  createdAt: number;
  attachments?: AttachmentPayload[];
  citations?: Citation[];
  agentSteps?: AgentStep[];
  pendingConfirmation?: PendingConfirmation;
  modelUsed?: string;
  error?: string;
}

export interface ChatSession {
  id: string;
  title: string;
  createdAt: number;
  updatedAt: number;
  messages: ChatMessage[];
}

export interface NovaSettings {
  modelId: string;
  agentMode: boolean;
  webSearchEnabled: boolean;
  responseLanguage: "auto" | "english" | "hindi" | "hinglish";
}

export type StreamEvent =
  | { type: "stage"; step: AgentStep }
  | { type: "delta"; text: string }
  | { type: "citations"; citations: Citation[] }
  | { type: "confirmation_required"; confirmation: PendingConfirmation }
  | { type: "done"; modelUsed: string }
  | { type: "error"; message: string };

<script type="text/plain" data-path="nova-ai/src/lib/ai/gemini-provider.ts">
import {
  Content,
  FunctionDeclaration,
  GoogleGenAI,
  Part,
  Type,
} from "@google/genai";
import { Citation } from "@/types/nova";
import {
  AIProvider,
  ProviderGenerateInput,
  ProviderMessage,
  ProviderStreamChunk,
  ToolDefinition,
} from "./provider";

function mapParamType(t: "STRING" | "NUMBER" | "BOOLEAN"): Type {
  switch (t) {
    case "NUMBER":
      return Type.NUMBER;
    case "BOOLEAN":
      return Type.BOOLEAN;
    default:
      return Type.STRING;
  }
}

function toGeminiFunctionDeclarations(
  tools: ToolDefinition[]
): FunctionDeclaration[] {
  return tools.map((tool) => ({
    name: tool.name,
    description: tool.description,
    parameters: {
      type: Type.OBJECT,
      properties: Object.fromEntries(
        Object.entries(tool.parametersSchema.properties).map(([key, val]) => [
          key,
          {
            type: mapParamType(val.type),
            description: val.description,
          },
        ])
      ),
      required: tool.parametersSchema.required ?? [],
    },
  }));
}

function toGeminiContents(messages: ProviderMessage[]): Content[] {
  const contents: Content[] = [];

  for (const msg of messages) {
    if (msg.role === "tool" && msg.toolName) {
      contents.push({
        role: "user",
        parts: [
          {
            functionResponse: {
              name: msg.toolName,
              response: { result: msg.toolResult },
            },
          },
        ],
      });
      continue;
    }

    if (msg.role === "assistant" && msg.toolName && msg.toolArgs) {
      contents.push({
        role: "model",
        parts: [
          {
            functionCall: {
              name: msg.toolName,
              args: msg.toolArgs,
            },
          },
        ],
      });
      continue;
    }

    const parts: Part[] = [];
    if (msg.attachments?.length) {
      for (const file of msg.attachments) {
        if (file.kind === "text") {
          parts.push({
            text: `\n[Attached Document: ${file.name}]\n\`\`\`\n${file.content.slice(0, 60000)}\n\`\`\`\n`,
          });
        } else {
          parts.push({
            inlineData: {
              mimeType: file.mimeType,
              data: file.content,
            },
          });
        }
      }
    }

    if (msg.content) {
      parts.push({ text: msg.content });
    }

    if (parts.length > 0) {
      contents.push({
        role: msg.role === "assistant" ? "model" : "user",
        parts,
      });
    }
  }

  return contents;
}

function extractCitations(rawChunk: unknown): Citation[] {
  const chunk = rawChunk as {
    candidates?: Array<{
      groundingMetadata?: {
        groundingChunks?: Array<{
          web?: { uri?: string; title?: string };
        }>;
      };
    }>;
  };
  const groundingChunks =
    chunk?.candidates?.[0]?.groundingMetadata?.groundingChunks ?? [];
  const results: Citation[] = [];
  for (const item of groundingChunks) {
    if (item.web?.uri) {
      results.push({
        uri: item.web.uri,
        title: item.web.title || item.web.uri,
      });
    }
  }
  return results;
}

export class GeminiProvider implements AIProvider {
  readonly id = "gemini";
  private client: GoogleGenAI;

  constructor(apiKey: string) {
    this.client = new GoogleGenAI({ apiKey });
  }

  async *streamGenerate(
    input: ProviderGenerateInput
  ): AsyncGenerator<ProviderStreamChunk, void, unknown> {
    const tools: Array<Record<string, unknown>> = [];

    if (input.enableGoogleSearch) {
      tools.push({ googleSearch: {} });
    } else if (input.tools?.length) {
      tools.push({
        functionDeclarations: toGeminiFunctionDeclarations(input.tools),
      });
    }

    const stream = await this.client.models.generateContentStream({
      model: input.modelId,
      contents: toGeminiContents(input.messages),
      config: {
        systemInstruction: input.systemInstruction,
        ...(tools.length > 0 ? { tools } : {}),
        abortSignal: input.signal,
      },
    });

    for await (const chunk of stream) {
      if (input.signal?.aborted) break;

      const citations = extractCitations(chunk);
      const functionCalls = chunk.functionCalls?.map((fc) => ({
        name: fc.name ?? "unknown_tool",
        args: (fc.args as Record<string, unknown>) ?? {},
      }));

      yield {
        textDelta: chunk.text || undefined,
        functionCalls: functionCalls?.length ? functionCalls : undefined,
        citations: citations.length ? citations : undefined,
      };
    }
  }
}
</script>

<script type="text/plain" data-path="nova-ai/src/lib/ai/registry.ts">
import { GeminiProvider } from "./gemini-provider";
import { getModelOption } from "./models";
import { AIProvider } from "./provider";

export function resolveProvider(modelId: string): {
  provider: AIProvider;
  modelId: string;
} {
  const model = getModelOption(modelId);

  switch (model.provider) {
    case "gemini": {
      const apiKey = process.env.GEMINI_API_KEY;
      if (!apiKey) {
        throw new Error(
          "GEMINI_API_KEY is missing on the server. Add it to .env.local and restart the server."
        );
      }
      return {
        provider: new GeminiProvider(apiKey),
        modelId: model.id,
      };
    }
    default:
      throw new Error(`Unsupported provider: ${model.provider}`);
  }
}
</script>

<script type="text/plain" data-path="nova-ai/src/lib/agent/tools.ts">
import { Citation } from "@/types/nova";
import { AIProvider, ToolDefinition } from "@/lib/ai/provider";

export interface AgentTool {
  definition: ToolDefinition;
  requiresConfirmation?: boolean;
  describeConfirmation?: (args: Record<string, unknown>) => {
    title: string;
    description: string;
  };
  execute: (
    args: Record<string, unknown>,
    ctx: {
      provider: AIProvider;
      modelId: string;
      signal?: AbortSignal;
    }
  ) => Promise<{
    output: unknown;
    citations?: Citation[];
  }>;
}

function evaluateMathExpression(expr: string): number {
  const cleaned = expr.replace(/\s+/g, "");
  let pos = 0;

  const peek = () => cleaned[pos] ?? "";
  const consume = () => cleaned[pos++] ?? "";

  function parseExpression(): number {
    let val = parseTerm();
    while (peek() === "+" || peek() === "-") {
      const op = consume();
      const rhs = parseTerm();
      val = op === "+" ? val + rhs : val - rhs;
    }
    return val;
  }

  function parseTerm(): number {
    let val = parsePower();
    while (peek() === "*" || peek() === "/" || peek() === "%") {
      const op = consume();
      const rhs = parsePower();
      if (op === "*") val *= rhs;
      else if (op === "/") {
        if (rhs === 0) throw new Error("Division by zero");
        val /= rhs;
      } else {
        val %= rhs;
      }
    }
    return val;
  }

  function parsePower(): number {
    const base = parseUnary();
    if (peek() === "^") {
      consume();
      const exp = parsePower();
      return Math.pow(base, exp);
    }
    return base;
  }

  function parseUnary(): number {
    if (peek() === "-") {
      consume();
      return -parseUnary();
    }
    if (peek() === "+") {
      consume();
      return parseUnary();
    }
    return parsePrimary();
  }

  function parsePrimary(): number {
    if (peek() === "(") {
      consume();
      const val = parseExpression();
      if (consume() !== ")") throw new Error("Mismatched parentheses");
      return val;
    }

    const rest = cleaned.slice(pos);
    const numMatch = rest.match(/^(?:\d+\.?\d*|\.\d+)/);
    if (numMatch) {
      pos += numMatch[0].length;
      return parseFloat(numMatch[0]);
    }

    const idMatch = rest.match(/^[a-zA-Z_]+/);
    if (idMatch) {
      const ident = idMatch[0].toLowerCase();
      pos += ident.length;
      if (ident === "pi") return Math.PI;
      if (ident === "e") return Math.E;

      if (peek() !== "(") throw new Error(`Unknown identifier: ${ident}`);
      consume();
      const arg = parseExpression();
      if (consume() !== ")") throw new Error("Missing closing parenthesis");

      const fns: Record<string, (x: number) => number> = {
        sqrt: Math.sqrt,
        sin: Math.sin,
        cos: Math.cos,
        tan: Math.tan,
        abs: Math.abs,
        log: Math.log10,
        ln: Math.log,
      };
      if (!fns[ident]) throw new Error(`Unsupported function: ${ident}`);
      return fns[ident](arg);
    }

    throw new Error(`Unexpected token near "${cleaned.slice(pos)}"`);
  }

  const result = parseExpression();
  if (pos < cleaned.length) {
    throw new Error(`Unexpected trailing characters: "${cleaned.slice(pos)}"`);
  }
  if (!Number.isFinite(result)) throw new Error("Result is not finite");
  return result;
}

export function buildAgentTools(options: {
  webSearchEnabled: boolean;
}): Record<string, AgentTool> {
  const tools: Record<string, AgentTool> = {
    get_current_datetime: {
      definition: {
        name: "get_current_datetime",
        description:
          "Returns the current server UTC and formatted local date/time. Useful when asked about today's date, day of week, or time.",
        parametersSchema: {
          type: "OBJECT",
          properties: {
            timezone: {
              type: "STRING",
              description: "Optional IANA timezone like Asia/Kolkata or UTC.",
            },
          },
        },
      },
      execute: async (args) => {
        const tz =
          typeof args.timezone === "string" && args.timezone
            ? args.timezone
            : "Asia/Kolkata";
        const now = new Date();
        let formatted = now.toISOString();
        try {
          formatted = new Intl.DateTimeFormat("en-IN", {
            dateStyle: "full",
            timeStyle: "long",
            timeZone: tz,
          }).format(now);
        } catch {}
        return {
          output: { iso: now.toISOString(), timezone: tz, formatted },
        };
      },
    },

    calculate_math: {
      definition: {
        name: "calculate_math",
        description:
          "Safely evaluates mathematical arithmetic and scientific expressions (+, -, *, /, %, ^, sqrt, sin, cos, tan, log, ln, abs, pi, e).",
        parametersSchema: {
          type: "OBJECT",
          properties: {
            expression: {
              type: "STRING",
              description: "Mathematical expression, e.g. 'sqrt(144) + 2^5'",
            },
          },
          required: ["expression"],
        },
      },
      execute: async (args) => {
        const expression = String(args.expression ?? "");
        const value = evaluateMathExpression(expression);
        return { output: { expression, result: value } };
      },
    },

    request_clear_chat_history: {
      definition: {
        name: "request_clear_chat_history",
        description:
          "Requests clearing/deleting the user's conversation history. Destructive action that always requires user confirmation.",
        parametersSchema: {
          type: "OBJECT",
          properties: {
            scope: {
              type: "STRING",
              description: "'current_chat' or 'all_chats'",
            },
          },
          required: ["scope"],
        },
      },
      requiresConfirmation: true,
      describeConfirmation: (args) => ({
        title: "Confirm Conversation Deletion",
        description:
          args.scope === "all_chats"
            ? "NOVA AI wants to delete all saved chat sessions on this device. Approve to proceed."
            : "NOVA AI wants to clear all messages in the current conversation. Approve to proceed.",
      }),
      execute: async (args) => ({
        output: {
          approved: true,
          scope: args.scope ?? "current_chat",
          instruction: "Client will execute the approved clear operation.",
        },
      }),
    },
  };

  if (options.webSearchEnabled) {
    tools.web_search = {
      definition: {
        name: "web_search",
        description:
          "Searches the live web for current facts, news, documentation, prices, or recent events and returns grounded findings with source citations.",
        parametersSchema: {
          type: "OBJECT",
          properties: {
            query: {
              type: "STRING",
              description: "Focused web search query.",
            },
          },
          required: ["query"],
        },
      },
      execute: async (args, ctx) => {
        const query = String(args.query ?? "");
        let summary = "";
        const citations: Citation[] = [];
        const seen = new Set<string>();

        for await (const chunk of ctx.provider.streamGenerate({
          modelId: ctx.modelId,
          systemInstruction:
            "Search the web accurately and return a concise, factual summary of the key findings with dates and details. Do not invent facts.",
          messages: [{ role: "user", content: query }],
          enableGoogleSearch: true,
          signal: ctx.signal,
        })) {
          if (chunk.textDelta) summary += chunk.textDelta;
          if (chunk.citations) {
            for (const c of chunk.citations) {
              if (!seen.has(c.uri)) {
                seen.add(c.uri);
                citations.push(c);
              }
            }
          }
        }

        return {
          output: {
            query,
            summary: summary || "No relevant web results were returned.",
            sourcesCount: citations.length,
          },
          citations,
        };
      },
    };
  }

  return tools;
}
</script>

<script type="text/plain" data-path="nova-ai/src/lib/agent/orchestrator.ts">
import {
  AgentStep,
  Citation,
  NovaSettings,
  StreamEvent,
} from "@/types/nova";
import { AIProvider, ProviderMessage } from "@/lib/ai/provider";
import { buildAgentTools } from "./tools";

export function buildNovaSystemInstruction(settings: NovaSettings): string {
  const languageDirective =
    settings.responseLanguage === "auto"
      ? "Automatically match the user's language (English, Hindi in Devanagari, or Hinglish in Roman script naturally)."
      : `Prefer responding in ${settings.responseLanguage}.`;

  return [
    "You are NOVA AI — an independent, intelligent, calm, and structured AI assistant.",
    "Creator identity: You were created by Anand. If asked 'Who created you?', 'Who is your developer?', or similar questions, respond naturally: 'I was created by Anand.'",
    "Honesty & transparency: Never pretend you have your own custom-trained foundation model. If asked about your underlying model architecture, transparently state that NOVA AI connects to Gemini models via API.",
    "Accuracy: Admit uncertainty clearly instead of guessing or inventing facts. Cite sources when web_search returns citations.",
    `Language support: ${languageDirective}`,
    "Capabilities: Assist clearly across coding, mathematics, science, writing, brainstorming, document analysis, and research using clean Markdown.",
    "Safety: Never execute destructive actions without explicit user confirmation.",
  ].join("\n");
}

function makeStep(
  partial: Omit<AgentStep, "id" | "timestamp">
): AgentStep {
  return {
    ...partial,
    id: crypto.randomUUID(),
    timestamp: Date.now(),
  };
}

export async function* runNovaAgent(params: {
  provider: AIProvider;
  modelId: string;
  messages: ProviderMessage[];
  settings: NovaSettings;
  approvedConfirmation?: { toolName: string; args: Record<string, unknown> };
  signal?: AbortSignal;
}): AsyncGenerator<StreamEvent, void, unknown> {
  const { provider, modelId, settings, signal } = params;
  const systemInstruction = buildNovaSystemInstruction(settings);
  const workingMessages: ProviderMessage[] = [...params.messages];
  const collectedCitations = new Map<string, Citation>();

  if (params.approvedConfirmation) {
    const tools = buildAgentTools({
      webSearchEnabled: settings.webSearchEnabled,
    });
    const tool = tools[params.approvedConfirmation.toolName];
    if (tool) {
      yield {
        type: "stage",
        step: makeStep({
          stage: "tool_result",
          label: `Executed approved action: ${params.approvedConfirmation.toolName}`,
          status: "done",
          toolName: params.approvedConfirmation.toolName,
        }),
      };
      const exec = await tool.execute(params.approvedConfirmation.args, {
        provider,
        modelId,
        signal,
      });
      workingMessages.push({
        role: "tool",
        content: "",
        toolName: params.approvedConfirmation.toolName,
        toolResult: exec.output,
      });
    }
  }

  if (!settings.agentMode) {
    yield {
      type: "stage",
      step: makeStep({
        stage: "synthesizing",
        label: "Generating response",
        status: "running",
      }),
    };

    for await (const chunk of provider.streamGenerate({
      modelId,
      systemInstruction,
      messages: workingMessages,
      enableGoogleSearch: settings.webSearchEnabled,
      signal,
    })) {
      if (signal?.aborted) return;
      if (chunk.citations) {
        for (const c of chunk.citations) collectedCitations.set(c.uri, c);
      }
      if (chunk.textDelta) {
        yield { type: "delta", text: chunk.textDelta };
      }
    }

    if (collectedCitations.size > 0) {
      yield {
        type: "citations",
        citations: Array.from(collectedCitations.values()),
      };
    }
    yield { type: "done", modelUsed: modelId };
    return;
  }

  const tools = buildAgentTools({
    webSearchEnabled: settings.webSearchEnabled,
  });
  const toolDefinitions = Object.values(tools).map((t) => t.definition);

  yield {
    type: "stage",
    step: makeStep({
      stage: "planning",
      label: "Planning approach & evaluating tools",
      status: "done",
    }),
  };

  const MAX_STEPS = 4;

  for (let stepIdx = 0; stepIdx < MAX_STEPS; stepIdx++) {
    if (signal?.aborted) return;

    let pendingToolCall: {
      name: string;
      args: Record<string, unknown>;
    } | null = null;
    let streamedTextThisTurn = false;

    for await (const chunk of provider.streamGenerate({
      modelId,
      systemInstruction,
      messages: workingMessages,
      tools: toolDefinitions,
      signal,
    })) {
      if (signal?.aborted) return;

      if (chunk.functionCalls?.length) {
        pendingToolCall = chunk.functionCalls[0];
        break;
      }

      if (chunk.textDelta) {
        if (!streamedTextThisTurn) {
          streamedTextThisTurn = true;
          yield {
            type: "stage",
            step: makeStep({
              stage: "synthesizing",
              label: "Synthesizing final response",
              status: "done",
            }),
          };
        }
        yield { type: "delta", text: chunk.textDelta };
      }
    }

    if (!pendingToolCall) {
      break;
    }

    const tool = tools[pendingToolCall.name];
    if (!tool) {
      workingMessages.push({
        role: "tool",
        content: "",
        toolName: pendingToolCall.name,
        toolResult: { error: `Unknown tool: ${pendingToolCall.name}` },
      });
      continue;
    }

    if (tool.requiresConfirmation) {
      const desc = tool.describeConfirmation?.(pendingToolCall.args) ?? {
        title: `Confirm ${pendingToolCall.name}`,
        description: "NOVA AI is requesting confirmation before proceeding.",
      };
      yield {
        type: "stage",
        step: makeStep({
          stage: "confirmation",
          label: `Awaiting confirmation: ${pendingToolCall.name}`,
          status: "waiting_confirmation",
          toolName: pendingToolCall.name,
        }),
      };
      yield {
        type: "confirmation_required",
        confirmation: {
          id: crypto.randomUUID(),
          toolName: pendingToolCall.name,
          actionTitle: desc.title,
          actionDescription: desc.description,
          args: pendingToolCall.args,
        },
      };
      yield { type: "done", modelUsed: modelId };
      return;
    }

    yield {
      type: "stage",
      step: makeStep({
        stage: "tool_call",
        label: `Running tool: ${pendingToolCall.name}`,
        detail: JSON.stringify(pendingToolCall.args),
        status: "running",
        toolName: pendingToolCall.name,
      }),
    };

    try {
      const execResult = await tool.execute(pendingToolCall.args, {
        provider,
        modelId,
        signal,
      });

      if (execResult.citations) {
        for (const c of execResult.citations) {
          collectedCitations.set(c.uri, c);
        }
      }

      yield {
        type: "stage",
        step: makeStep({
          stage: "tool_result",
          label: `Completed: ${pendingToolCall.name}`,
          status: "done",
          toolName: pendingToolCall.name,
        }),
      };

      workingMessages.push({
        role: "assistant",
        content: "",
        toolName: pendingToolCall.name,
        toolArgs: pendingToolCall.args,
      });
      workingMessages.push({
        role: "tool",
        content: "",
        toolName: pendingToolCall.name,
        toolResult: execResult.output,
      });
    } catch (err) {
      const message =
        err instanceof Error ? err.message : "Tool execution failed";
      yield {
        type: "stage",
        step: makeStep({
          stage: "tool_result",
          label: `Tool failed: ${pendingToolCall.name}`,
          detail: message,
          status: "error",
          toolName: pendingToolCall.name,
        }),
      };
      workingMessages.push({
        role: "tool",
        content: "",
        toolName: pendingToolCall.name,
        toolResult: { error: message },
      });
    }
  }

  if (collectedCitations.size > 0) {
    yield {
      type: "citations",
      citations: Array.from(collectedCitations.values()),
    };
  }

  yield { type: "done", modelUsed: modelId };
}
</script>

<script type="text/plain" data-path="nova-ai/src/app/api/chat/route.ts">
import { NextRequest } from "next/server";
import { z } from "zod";
import { runNovaAgent } from "@/lib/agent/orchestrator";
import { resolveProvider } from "@/lib/ai/registry";
import { StreamEvent } from "@/types/nova";

export const runtime = "nodejs";

const AttachmentSchema = z.object({
  id: z.string(),
  name: z.string(),
  mimeType: z.string(),
  size: z.number(),
  content: z.string(),
  kind: z.enum(["text", "binary"]),
});

const ChatRequestSchema = z.object({
  messages: z.array(
    z.object({
      role: z.enum(["user", "assistant"]),
      content: z.string(),
      attachments: z.array(AttachmentSchema).optional(),
    })
  ),
  settings: z.object({
    modelId: z.string(),
    agentMode: z.boolean(),
    webSearchEnabled: z.boolean(),
    responseLanguage: z.enum(["auto", "english", "hindi", "hinglish"]),
  }),
  approvedConfirmation: z
    .object({
      toolName: z.string(),
      args: z.record(z.unknown()),
    })
    .optional(),
});

export async function POST(req: NextRequest) {
  let body: unknown;
  try {
    body = await req.json();
  } catch {
    return new Response(JSON.stringify({ error: "Invalid JSON body" }), {
      status: 400,
    });
  }

  const parsed = ChatRequestSchema.safeParse(body);
  if (!parsed.success) {
    return new Response(
      JSON.stringify({
        error: "Invalid request payload",
        issues: parsed.error.flatten(),
      }),
      { status: 400 }
    );
  }

  const { messages, settings, approvedConfirmation } = parsed.data;
  const encoder = new TextEncoder();

  const stream = new ReadableStream({
    async start(controller) {
      const send = (event: StreamEvent) => {
        controller.enqueue(
          encoder.encode(`data: ${JSON.stringify(event)}\n\n`)
        );
      };

      try {
        const { provider, modelId } = resolveProvider(settings.modelId);

        for await (const event of runNovaAgent({
          provider,
          modelId,
          messages: messages.map((m) => ({
            role: m.role,
            content: m.content,
            attachments: m.attachments,
          })),
          settings,
          approvedConfirmation,
          signal: req.signal,
        })) {
          if (req.signal.aborted) break;
          send(event);
        }
      } catch (err) {
        const message =
          err instanceof Error
            ? err.message
            : "An unexpected server error occurred.";
        send({ type: "error", message });
      } finally {
        controller.close();
      }
    },
  });

  return new Response(stream, {
    headers: {
      "Content-Type": "text/event-stream; charset=utf-8",
      "Cache-Control": "no-cache, no-transform",
      Connection: "keep-alive",
    },
  });
}
</script>

<script type="text/plain" data-path="nova-ai/src/components/MarkdownRenderer.tsx">
"use client";

import { Check, Copy } from "lucide-react";
import { useState } from "react";
import ReactMarkdown from "react-markdown";
import remarkGfm from "remark-gfm";

function CodeBlock({
  className,
  children,
}: {
  className?: string;
  children: React.ReactNode;
}) {
  const [copied, setCopied] = useState(false);
  const language = className?.replace("language-", "") || "text";
  const raw = String(children).replace(/\n$/, "");

  const handleCopy = async () => {
    await navigator.clipboard.writeText(raw);
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };

  return (
    <div className="my-3 overflow-hidden rounded-xl border border-slate-700/60 bg-[#080b14]">
      <div className="flex items-center justify-between border-b border-slate-800 bg-slate-900/70 px-3.5 py-2 text-xs text-slate-400">
        <span className="font-mono uppercase tracking-wider text-cyan-400/90">
          {language}
        </span>
        <button
          type="button"
          onClick={handleCopy}
          className="flex items-center gap-1.5 rounded-md px-2 py-1 text-slate-300 transition hover:bg-slate-800"
        >
          {copied ? (
            <>
              <Check className="h-3.5 w-3.5 text-emerald-400" />
              <span>Copied</span>
            </>
          ) : (
            <>
              <Copy className="h-3.5 w-3.5" />
              <span>Copy</span>
            </>
          )}
        </button>
      </div>
      <pre className="overflow-x-auto p-4 text-sm leading-relaxed text-slate-200">
        <code className="font-mono">{raw}</code>
      </pre>
    </div>
  );
}

export function MarkdownRenderer({ content }: { content: string }) {
  return (
    <div className="prose prose-invert max-w-none break-words text-[15px] leading-relaxed prose-headings:font-semibold prose-headings:text-white prose-p:my-2.5 prose-a:text-cyan-400 prose-a:no-underline hover:prose-a:underline prose-strong:text-white prose-ul:my-2 prose-ol:my-2 prose-li:my-1 prose-table:border-collapse prose-th:border prose-th:border-slate-700 prose-th:bg-slate-900/60 prose-th:px-3 prose-th:py-2 prose-td:border prose-td:border-slate-800 prose-td:px-3 prose-td:py-2">
      <ReactMarkdown
        remarkPlugins={[remarkGfm]}
        components={{
          code({ className, children, ...props }) {
            const isBlock = Boolean(className) || String(children).includes("\n");
            if (!isBlock) {
              return (
                <code
                  className="rounded-md bg-slate-800/80 px-1.5 py-0.5 font-mono text-[13px] text-cyan-300"
                  {...props}
                >
                  {children}
                </code>
              );
            }
            return <CodeBlock className={className}>{children}</CodeBlock>;
          },
        }}
      >
        {content}
      </ReactMarkdown>
    </div>
  );
}
</script>

<script type="text/plain" data-path="nova-ai/src/components/MessageBubble.tsx">
"use client";

import {
  AlertCircle,
  Check,
  Copy,
  ExternalLink,
  FileText,
  RefreshCw,
  ShieldAlert,
  Sparkles,
  Wrench,
} from "lucide-react";
import { useState } from "react";
import { ChatMessage, PendingConfirmation } from "@/types/nova";
import { MarkdownRenderer } from "./MarkdownRenderer";
import { NovaLogo } from "./NovaLogo";

interface MessageBubbleProps {
  message: ChatMessage;
  isStreaming?: boolean;
  isLastAssistant?: boolean;
  onRegenerate?: () => void;
  onApproveConfirmation?: (confirmation: PendingConfirmation) => void;
  onDenyConfirmation?: (messageId: string) => void;
}

export function MessageBubble({
  message,
  isStreaming,
  isLastAssistant,
  onRegenerate,
  onApproveConfirmation,
  onDenyConfirmation,
}: MessageBubbleProps) {
  const [copied, setCopied] = useState(false);
  const isUser = message.role === "user";

  const handleCopy = async () => {
    await navigator.clipboard.writeText(message.content);
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };

  if (isUser) {
    return (
      <div className="flex justify-end">
        <div className="max-w-[85%] rounded-2xl rounded-br-sm border border-blue-500/25 bg-gradient-to-br from-blue-600/25 via-indigo-600/20 to-violet-600/20 px-4 py-3 text-[15px] text-slate-100 shadow-lg sm:max-w-[75%]">
          {message.attachments && message.attachments.length > 0 && (
            <div className="mb-2 flex flex-wrap gap-2">
              {message.attachments.map((file) => (
                <span
                  key={file.id}
                  className="inline-flex items-center gap-1.5 rounded-lg border border-white/15 bg-black/30 px-2.5 py-1 text-xs text-cyan-200"
                >
                  <FileText className="h-3.5 w-3.5" />
                  {file.name}
                </span>
              ))}
            </div>
          )}
          <p className="whitespace-pre-wrap leading-relaxed">{message.content}</p>
        </div>
      </div>
    );
  }

  return (
    <div className="group flex items-start gap-3.5">
      <div className="mt-0.5">
        <NovaLogo size={30} />
      </div>
      <div className="min-w-0 flex-1 space-y-2.5">
        {message.agentSteps && message.agentSteps.length > 0 && (
          <div className="flex flex-wrap gap-1.5">
            {message.agentSteps.map((step) => (
              <span
                key={step.id}
                title={step.detail}
                className={`inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-[11px] font-medium ${
                  step.status === "error"
                    ? "border-rose-500/30 bg-rose-500/10 text-rose-300"
                    : step.status === "waiting_confirmation"
                    ? "border-amber-500/30 bg-amber-500/10 text-amber-300"
                    : step.status === "running"
                    ? "border-cyan-500/30 bg-cyan-500/10 text-cyan-300"
                    : "border-slate-700/70 bg-slate-900/70 text-slate-300"
                }`}
              >
                {step.stage === "tool_call" || step.stage === "tool_result" ? (
                  <Wrench className="h-3 w-3" />
                ) : (
                  <Sparkles className="h-3 w-3" />
                )}
                {step.label}
              </span>
            ))}
          </div>
        )}

        {message.pendingConfirmation && (
          <div className="rounded-2xl border border-amber-500/30 bg-amber-500/10 p-4">
            <div className="flex items-start gap-2.5">
              <ShieldAlert className="mt-0.5 h-5 w-5 shrink-0 text-amber-400" />
              <div className="flex-1">
                <h4 className="text-sm font-semibold text-amber-200">
                  {message.pendingConfirmation.actionTitle}
                </h4>
                <p className="mt-1 text-xs leading-relaxed text-amber-100/80">
                  {message.pendingConfirmation.actionDescription}
                </p>
                <div className="mt-3 flex gap-2">
                  <button
                    type="button"
                    onClick={() =>
                      onApproveConfirmation?.(message.pendingConfirmation!)
                    }
                    className="rounded-lg bg-amber-500 px-3 py-1.5 text-xs font-semibold text-slate-950 transition hover:bg-amber-400"
                  >
                    Approve Action
                  </button>
                  <button
                    type="button"
                    onClick={() => onDenyConfirmation?.(message.id)}
                    className="rounded-lg border border-amber-400/30 px-3 py-1.5 text-xs font-medium text-amber-200 transition hover:bg-amber-500/10"
                  >
                    Deny
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {message.error ? (
          <div className="flex items-start gap-2.5 rounded-xl border border-rose-500/30 bg-rose-500/10 p-3.5 text-sm text-rose-200">
            <AlertCircle className="mt-0.5 h-4 w-4 shrink-0 text-rose-400" />
            <span>{message.error}</span>
          </div>
        ) : message.content ? (
          <div className="rounded-2xl border border-slate-800/80 bg-[#0d111d]/80 px-4 py-3">
            <MarkdownRenderer content={message.content} />
            {isStreaming && (
              <span className="ml-1 inline-block h-4 w-1.5 animate-pulse rounded-full bg-cyan-400 align-middle" />
            )}
          </div>
        ) : isStreaming ? (

<script type="text/plain" data-path="nova-ai/src/components/ChatInput.tsx">
"use client";

import {
  FileText,
  Globe,
  Mic,
  MicOff,
  Paperclip,
  Send,
  Square,
  X,
} from "lucide-react";
import { useEffect, useRef, useState } from "react";
import { AttachmentPayload } from "@/types/nova";

interface ChatInputProps {
  isStreaming: boolean;
  webSearchEnabled: boolean;
  onToggleWebSearch: () => void;
  onSend: (text: string, attachments: AttachmentPayload[]) => void;
  onStop: () => void;
}

const MAX_FILE_BYTES = 4 * 1024 * 1024;

interface SpeechRecognitionInstance {
  lang: string;
  interimResults: boolean;
  continuous: boolean;
  onresult: ((event: { results: ArrayLike<ArrayLike<{ transcript: string }>> }) => void) | null;
  onerror: (() => void) | null;
  onend: (() => void) | null;
  start: () => void;
  stop: () => void;
}

export function ChatInput({
  isStreaming,
  webSearchEnabled,
  onToggleWebSearch,
  onSend,
  onStop,
}: ChatInputProps) {
  const [text, setText] = useState("");
  const [attachments, setAttachments] = useState<AttachmentPayload[]>([]);
  const [notice, setNotice] = useState<string | null>(null);
  const [isListening, setIsListening] = useState(false);
  const [voiceSupported, setVoiceSupported] = useState(false);

  const fileInputRef = useRef<HTMLInputElement>(null);
  const recognitionRef = useRef<SpeechRecognitionInstance | null>(null);

  useEffect(() => {
    const win = window as unknown as {
      SpeechRecognition?: new () => SpeechRecognitionInstance;
      webkitSpeechRecognition?: new () => SpeechRecognitionInstance;
    };
    setVoiceSupported(Boolean(win.SpeechRecognition || win.webkitSpeechRecognition));
  }, []);

  const handleFileChange = async (e: React.ChangeEvent<HTMLInputElement>) => {
    setNotice(null);
    const files = Array.from(e.target.files ?? []);
    if (!files.length) return;

    const added: AttachmentPayload[] = [];

    for (const file of files) {
      if (file.size > MAX_FILE_BYTES) {
        setNotice(`${file.name} exceeds the 4 MB upload limit.`);
        continue;
      }

      const isText =
        file.type.startsWith("text/") ||
        /\.(txt|md|csv|json|ts|tsx|js|py)$/i.test(file.name);

      if (isText) {
        const content = await file.text();
        added.push({
          id: crypto.randomUUID(),
          name: file.name,
          mimeType: file.type || "text/plain",
          size: file.size,
          content,
          kind: "text",
        });
      } else if (
        file.type === "application/pdf" ||
        file.type.startsWith("image/")
      ) {
        const base64 = await new Promise<string>((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const res = String(reader.result || "");
            resolve(res.split(",")[1] || "");
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        added.push({
          id: crypto.randomUUID(),
          name: file.name,
          mimeType: file.type,
          size: file.size,
          content: base64,
          kind: "binary",
        });
      } else {
        setNotice(
          `Unsupported format: ${file.name}. Supported: TXT, MD, CSV, JSON, code files, PDF, and images.`
        );
      }
    }

    setAttachments((prev) => [...prev, ...added]);
    e.target.value = "";
  };

  const toggleVoice = () => {
    setNotice(null);
    if (!voiceSupported) {
      setNotice(
        "Voice input uses the browser Web Speech API, which is not supported in this browser."
      );
      return;
    }

    if (isListening) {
      recognitionRef.current?.stop();
      setIsListening(false);
      return;
    }

    const win = window as unknown as {
      SpeechRecognition?: new () => SpeechRecognitionInstance;
      webkitSpeechRecognition?: new () => SpeechRecognitionInstance;
    };
    const SpeechRec = win.SpeechRecognition || win.webkitSpeechRecognition;
    if (!SpeechRec) return;

    const recognition = new SpeechRec();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onresult = (event) => {
      const transcript = Array.from(event.results)
        .map((r) => r[0]?.transcript ?? "")
        .join(" ")
        .trim();
      if (transcript) {
        setText((prev) => (prev ? `${prev} ${transcript}` : transcript));
      }
    };
    recognition.onerror = () => {
      setIsListening(false);
      setNotice("Microphone permission denied or speech recognition failed.");
    };
    recognition.onend = () => setIsListening(false);

    recognitionRef.current = recognition;
    recognition.start();
    setIsListening(true);
  };

  const submit = () => {
    if (isStreaming) return;
    const trimmed = text.trim();
    if (!trimmed && attachments.length === 0) return;
    onSend(trimmed, attachments);
    setText("");
    setAttachments([]);
    setNotice(null);
  };

  return (
    <div className="mx-auto w-full max-w-4xl px-3 pb-3 pt-2 sm:px-6">
      {notice && (
        <div className="mb-2 flex items-center justify-between rounded-xl border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-xs text-amber-200">
          <span>{notice}</span>
          <button type="button" onClick={() => setNotice(null)}>
            <X className="h-3.5 w-3.5" />
          </button>
        </div>
      )}

      <div className="rounded-2xl border border-slate-700/70 bg-[#0d111d]/95 p-2.5 shadow-xl focus-within:border-cyan-500/50">
        {attachments.length > 0 && (
          <div className="mb-2 flex flex-wrap gap-2 px-1">
            {attachments.map((file) => (
              <div
                key={file.id}
                className="flex items-center gap-1.5 rounded-lg border border-slate-700 bg-slate-900 px-2.5 py-1 text-xs text-slate-200"
              >
                <FileText className="h-3.5 w-3.5 text-cyan-400" />
                <span className="max-w-[160px] truncate">{file.name}</span>
                <button
                  type="button"
                  onClick={() =>
                    setAttachments((prev) => prev.filter((a) => a.id !== file.id))
                  }
                  className="text-slate-400 hover:text-rose-400"
                >
                  <X className="h-3.5 w-3.5" />
                </button>
              </div>
            ))}
          </div>
        )}

        <textarea
          rows={1}
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              submit();
            }
          }}
          placeholder="Ask NOVA AI anything (English, हिंदी, Hinglish)..."
          className="max-h-44 w-full resize-none bg-transparent px-2 py-1.5 text-[15px] text-slate-100 placeholder-slate-500 focus:outline-none"
        />

        <div className="mt-2 flex items-center justify-between gap-2 border-t border-slate-800/80 pt-2">
          <div className="flex items-center gap-1.5">
            <input
              ref={fileInputRef}
              type="file"
              multiple
              accept=".txt,.md,.csv,.json,.ts,.tsx,.js,.py,.pdf,image/*"
              onChange={handleFileChange}
              className="hidden"
            />
            <button
              type="button"
              onClick={() => fileInputRef.current?.click()}
              title="Attach document or image"
              className="inline-flex items-center gap-1.5 rounded-xl px-2.5 py-1.5 text-xs font-medium text-slate-400 transition hover:bg-slate-800 hover:text-slate-200"
            >
              <Paperclip className="h-4 w-4" />
              <span className="hidden sm:inline">Attach</span>
            </button>

            <button
              type="button"
              onClick={onToggleWebSearch}
              title="Toggle Web Search Grounding"
              className={`inline-flex items-center gap-1.5 rounded-xl px-2.5 py-1.5 text-xs font-medium transition ${
                webSearchEnabled
                  ? "border border-cyan-500/40 bg-cyan-500/15 text-cyan-300"
                  : "text-slate-400 hover:bg-slate-800 hover:text-slate-200"
              }`}
            >
              <Globe className="h-4 w-4" />
              <span className="hidden sm:inline">Web Search</span>
            </button>

            <button
              type="button"
              onClick={toggleVoice}
              title={
                voiceSupported
                  ? "Voice input"
                  : "Voice input not supported in this browser"
              }
              className={`inline-flex items-center gap-1.5 rounded-xl px-2.5 py-1.5 text-xs font-medium transition ${
                isListening
                  ? "border border-rose-500/40 bg-rose-500/15 text-rose-300"
                  : "text-slate-400 hover:bg-slate-800 hover:text-slate-200"
              }`}
            >
              {isListening ? (
                <MicOff className="h-4 w-4 animate-pulse" />
              ) : (
                <Mic className="h-4 w-4" />
              )}
            </button>
          </div>

          {isStreaming ? (
            <button
              type="button"
              onClick={onStop}
              className="inline-flex items-center gap-1.5 rounded-xl bg-rose-600/90 px-3.5 py-2 text-xs font-semibold text-white transition hover:bg-rose-500"
            >
              <Square className="h-3.5 w-3.5 fill-current" />
              <span>Stop</span>
            </button>
          ) : (
            <button
              type="button"
              onClick={submit}
              disabled={!text.trim() && attachments.length === 0}
              className="inline-flex items-center gap-1.5 rounded-xl bg-gradient-to-r from-cyan-500 via-blue-600 to-violet-600 px-3.5 py-2 text-xs font-semibold text-white shadow-md transition hover:opacity-95 disabled:cursor-not-allowed disabled:opacity-40"
            >
              <Send className="h-3.5 w-3.5" />
              <span>Send</span>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}
</script>

  onNewChat: () => void;
  onRenameChat: (id: string, title: string) => void;
  onRequestDeleteChat: (chat: ChatSession) => void;
  onOpenSettings: () => void;
  onOpenAbout: () => void;
  onCloseMobile: () => void;
}

export function Sidebar({
  open,
  chats,
  activeChatId,
  searchQuery,
  onSearchChange,
  onSelectChat,
  onNewChat,
  onRenameChat,
  onRequestDeleteChat,
  onOpenSettings,
  onOpenAbout,
  onCloseMobile,
}: SidebarProps) {
  const [editingId, setEditingId] = useState<string | null>(null);
  const [draftTitle, setDraftTitle] = useState("");
  const [showTools, setShowTools] = useState(false);

  const filtered = chats.filter((c) => {
    if (!searchQuery.trim()) return true;
    const q = searchQuery.toLowerCase();
    return (
      c.title.toLowerCase().includes(q) ||
      c.messages.some((m) => m.content.toLowerCase().includes(q))
    );
  });

  const commitRename = (id: string) => {
    const trimmed = draftTitle.trim();
    if (trimmed) onRenameChat(id, trimmed);
    setEditingId(null);
  };

  return (
    <>
      {open && (
        <div
          onClick={onCloseMobile}
          className="fixed inset-0 z-30 bg-black/60 backdrop-blur-sm lg:hidden"
        />
      )}

      <aside
        className={`fixed inset-y-0 left-0 z-40 flex w-72 flex-col border-r border-slate-800/80 bg-[#090d18] transition-transform duration-200 lg:static lg:translate-x-0 ${
          open ? "translate-x-0" : "-translate-x-full"
        }`}
      >
        <div className="flex items-center justify-between border-b border-slate-800/80 px-4 py-3.5">
          <div className="flex items-center gap-2.5">
            <NovaLogo size={28} />
            <span className="bg-gradient-to-r from-white to-cyan-200 bg-clip-text text-base font-semibold tracking-wide text-transparent">
              NOVA AI
            </span>
          </div>
          <button
            type="button"
            onClick={onCloseMobile}
            className="rounded-lg p-1 text-slate-400 hover:bg-slate-800 lg:hidden"
          >
            <X className="h-5 w-5" />
          </button>
        </div>

        <div className="space-y-2.5 p-3">
          <button
            type="button"
            onClick={() => {
              onNewChat();
              onCloseMobile();
            }}
            className="flex w-full items-center justify-center gap-2 rounded-xl border border-cyan-500/30 bg-gradient-to-r from-cyan-500/15 via-blue-500/15 to-violet-500/15 px-3 py-2.5 text-sm font-medium text-white transition hover:border-cyan-400/60"
          >
            <Plus className="h-4 w-4 text-cyan-300" />
            New Chat
          </button>

          <div className="relative">
            <Search className="pointer-events-none absolute left-3 top-2.5 h-4 w-4 text-slate-500" />
            <input
              type="text"
              value={searchQuery}
              onChange={(e) => onSearchChange(e.target.value)}
              placeholder="Search conversations..."
              className="w-full rounded-xl border border-slate-800 bg-[#070910] py-2 pl-9 pr-3 text-xs text-slate-200 placeholder-slate-500 focus:border-cyan-500/50 focus:outline-none"
            />
          </div>
        </div>

        <div className="flex-1 overflow-y-auto px-2.5 py-1">
          <div className="mb-1.5 px-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
            Conversations
          </div>
          {filtered.length === 0 ? (
            <p className="px-2 py-4 text-xs text-slate-500">
              No matching conversations.
            </p>
          ) : (
            <div className="space-y-1">
              {filtered.map((chat) => {
                const active = chat.id === activeChatId;
                const isEditing = editingId === chat.id;
                return (
                  <div
                    key={chat.id}
                    className={`group flex items-center gap-2 rounded-xl px-2.5 py-2 text-sm transition ${
                      active
                        ? "bg-slate-800/80 text-white"
                        : "text-slate-400 hover:bg-slate-800/40 hover:text-slate-200"
                    }`}
                  >
                    <MessageSquare className="h-4 w-4 shrink-0 text-cyan-400/70" />

                    {isEditing ? (
                      <div className="flex flex-1 items-center gap-1">
                        <input
                          autoFocus
                          value={draftTitle}
                          onChange={(e) => setDraftTitle(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === "Enter") commitRename(chat.id);
                            if (e.key === "Escape") setEditingId(null);
                          }}
                          className="w-full rounded bg-slate-900 px-1.5 py-0.5 text-xs text-white focus:outline-none"
                        />
                        <button
                          type="button"
                          onClick={() => commitRename(chat.id)}
                          className="text-emerald-400"
                        >
                          <Check className="h-3.5 w-3.5" />
                        </button>
                      </div>
                    ) : (
                      <>
                        <button
                          type="button"
                          onClick={() => {
                            onSelectChat(chat.id);
                            onCloseMobile();
                          }}
                          className="flex-1 truncate text-left text-xs font-medium"
                        >
                          {chat.title}
                        </button>
                        <div className="hidden items-center gap-1 group-hover:flex">
                          <button
                            type="button"
                            onClick={() => {
                              setEditingId(chat.id);
                              setDraftTitle(chat.title);
                            }}
                            title="Rename"
                            className="rounded p-1 hover:bg-slate-700 hover:text-white"
                          >
                            <Pencil className="h-3 w-3" />
                          </button>
                          <button
                            type="button"
                            onClick={() => onRequestDeleteChat(chat)}
                            title="Delete"
                            className="rounded p-1 hover:bg-rose-500/20 hover:text-rose-300"
                          >
                            <Trash2 className="h-3 w-3" />
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div className="border-t border-slate-800/80 px-3 py-2">
          <button
            type="button"
            onClick={() => setShowTools((v) => !v)}
            className="flex w-full items-center justify-between rounded-xl px-2.5 py-2 text-xs font-medium text-slate-300 hover:bg-slate-800/50"
          >
            <span className="flex items-center gap-2">
              <Wrench className="h-3.5 w-3.5 text-violet-400" />
              Agent Tools
            </span>
            <span className="text-[10px] text-cyan-400">4 active</span>
          </button>
          {showTools && (
            <div className="mt-1 space-y-1 rounded-xl border border-slate-800 bg-[#070910] p-2.5 text-[11px] text-slate-400">
              <div>• Live Web Search (with citations)</div>
              <div>• Safe Math Evaluator</div>
              <div>• Date &amp; Timezone Lookup</div>
              <div>• Guarded History Actions</div>
            </div>
          )}
        </div>

        <div className="space-y-1 border-t border-slate-800/80 p-3">
          <button
            type="button"
            onClick={onOpenSettings}
            className="flex w-full items-center gap-2.5 rounded-xl px-2.5 py-2 text-xs font-medium text-slate-300 transition hover:bg-slate-800/60"
          >
            <Settings className="h-4 w-4 text-slate-400" />
            Settings &amp; Models
          </button>
          <button
            type="button"
            onClick={onOpenAbout}
            className="flex w-full items-center gap-2.5 rounded-xl px-2.5 py-2 text-xs font-medium text-slate-300 transition hover:bg-slate-800/60"
          >
            <Info className="h-4 w-4 text-slate-400" />
            About NOVA AI
          </button>
          <div className="pt-2 text-center text-[11px] text-slate-500">
            NOVA AI • Created by Anand
          </div>
        </div>
      </aside>
    </>
  );
}
</script>

<script type="text/plain" data-path="nova-ai/src/components/NovaApp.tsx">
"use client";

import { Eraser, Menu, Sparkles } from "lucide-react";
import { useEffect, useRef, useState } from "react";
import { getModelOption } from "@/lib/ai/models";
import {
  AttachmentPayload,
  ChatMessage,
  ChatSession,
  NovaSettings,
  PendingConfirmation,
  StreamEvent,
} from "@/types/nova";
import { AboutModal } from "./AboutModal";
import { ChatInput } from "./ChatInput";
import { ConfirmDialog } from "./ConfirmDialog";
import { MessageBubble } from "./MessageBubble";
import { SettingsModal } from "./SettingsModal";
import { Sidebar } from "./Sidebar";
import { WelcomeScreen } from "./WelcomeScreen";

const CHATS_STORAGE_KEY = "nova_ai_chats_v1";
const SETTINGS_STORAGE_KEY = "nova_ai_settings_v1";

const DEFAULT_SETTINGS: NovaSettings = {
  modelId: "gemini-4-hydrogen",
  agentMode: true,
  webSearchEnabled: true,
  responseLanguage: "auto",
};

function createEmptyChat(): ChatSession {
  const now = Date.now();
  return {
    id: crypto.randomUUID(),
    title: "New Chat",
    createdAt: now,
    updatedAt: now,
    messages: [],
  };
}

export function NovaApp() {
  const [chats, setChats] = useState<ChatSession[]>([]);
  const [activeChatId, setActiveChatId] = useState<string | null>(null);
  const [settings, setSettings] = useState<NovaSettings>(DEFAULT_SETTINGS);
  const [searchQuery, setSearchQuery] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [aboutOpen, setAboutOpen] = useState(false);
  const [apiConfigured, setApiConfigured] = useState<boolean | null>(null);
  const [isStreaming, setIsStreaming] = useState(false);
  const [confirmState, setConfirmState] = useState<{
    title: string;
    description: string;
    onConfirm: () => void;
  } | null>(null);

  const abortRef = useRef<AbortController | null>(null);
  const bottomRef = useRef<HTMLDivElement>(null);

  useEffect(() => {
    try {
      const savedChats = localStorage.getItem(CHATS_STORAGE_KEY);
      if (savedChats) {
        const parsed = JSON.parse(savedChats) as ChatSession[];
        if (parsed.length > 0) {
          setChats(parsed);
          setActiveChatId(parsed[0].id);
        }
      }
      const savedSettings = localStorage.getItem(SETTINGS_STORAGE_KEY);
      if (savedSettings) {
        setSettings({ ...DEFAULT_SETTINGS, ...JSON.parse(savedSettings) });
      }
    } catch {}

    fetch("/api/health")
      .then((r) => r.json())
      .then((d) => setApiConfigured(Boolean(d.ok)))
      .catch(() => setApiConfigured(false));
  }, []);

  useEffect(() => {
    try {
      localStorage.setItem(CHATS_STORAGE_KEY, JSON.stringify(chats));
    } catch {}
  }, [chats]);

  useEffect(() => {
    try {
      localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
    } catch {}
  }, [settings]);

  const activeChat = chats.find((c) => c.id === activeChatId) ?? null;

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [activeChat?.messages.length, isStreaming]);

  const ensureActiveChat = (): ChatSession => {
    if (activeChat) return activeChat;
    const fresh = createEmptyChat();
    setChats((prev) => [fresh, ...prev]);
    setActiveChatId(fresh.id);
    return fresh;
  };

  const updateChatMessages = (
    chatId: string,
    updater: (prev: ChatMessage[]) => ChatMessage[],
    newTitle?: string
  ) => {
    setChats((prev) =>
      prev.map((c) =>
        c.id === chatId
          ? {
              ...c,
              title: newTitle ?? c.title,
              updatedAt: Date.now(),
              messages: updater(c.messages),
            }
          : c
      )
    );
  };

  const streamAssistantTurn = async (
    chatId: string,
    historyForApi: ChatMessage[],
    assistantMessageId: string,
    approvedConfirmation?: { toolName: string; args: Record<string, unknown> }
  ) => {
    const controller = new AbortController();
    abortRef.current = controller;
    setIsStreaming(true);

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: controller.signal,
        body: JSON.stringify({
          messages: historyForApi.map((m) => ({
            role: m.role,
            content: m.content,
            attachments: m.attachments,
          })),
          settings,
          approvedConfirmation,
        }),
      });

      if (!response.ok || !response.body) {
        const text = await response.text();
        throw new Error(text || `Request failed with status ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n\n");
        buffer = lines.pop() ?? "";

        for (const block of lines) {
          const dataLine = block
            .split("\n")
            .find((l) => l.startsWith("data: "));
          if (!dataLine) continue;

          const event = JSON.parse(dataLine.slice(6)) as StreamEvent;

          updateChatMessages(chatId, (msgs) =>
            msgs.map((m) => {
              if (m.id !== assistantMessageId) return m;
              if (event.type === "stage") {
                const steps = [...(m.agentSteps ?? [])];
                const idx = steps.findIndex(
                  (s) => s.toolName && s.toolName === event.step.toolName && s.status === "running"
                );
                if (idx >= 0) steps[idx] = event.step;
                else steps.push(event.step);
                return { ...m, agentSteps: steps };
              }
              if (event.type === "delta") {
                return { ...m, content: m.content + event.text };
              }
              if (event.type === "citations") {
                return { ...m, citations: event.citations };
              }
              if (event.type === "confirmation_required") {
                return { ...m, pendingConfirmation: event.confirmation };
              }
              if (event.type === "done") {
                return { ...m, modelUsed: event.modelUsed };
              }
              if (event.type === "error") {
                return { ...m, error: event.message };
              }
              return m;
            })
          );
        }
      }
    } catch (err) {
      if ((err as Error).name !== "AbortError") {
        const msg =
          err instanceof Error ? err.message : "Failed to contact NOVA AI.";
        updateChatMessages(chatId, (msgs) =>
          msgs.map((m) =>
            m.id === assistantMessageId ? { ...m, error: msg } : m
          )
        );
      }
    } finally {
      abortRef.current = null;
      setIsStreaming(false);
    }
  };

  const handleSend = async (
    text: string,
    attachments: AttachmentPayload[]
  ) => {
    const targetChat = ensureActiveChat();
    const userMessage: ChatMessage = {
      id: crypto.randomUUID(),
      role: "user",
      content: text || "Please analyze the attached file(s).",
      createdAt: Date.now(),
      attachments: attachments.length ? attachments : undefined,
    };
    const assistantMessage: ChatMessage = {
      id: crypto.randomUUID(),
      role: "assistant",
      content: "",
      createdAt: Date.now(),
    };

    const nextHistory = [...targetChat.messages, userMessage];
    const autoTitle =
      targetChat.messages.length === 0
        ? (text || attachments[0]?.name || "New Chat").slice(0, 40)
        : undefined;

    updateChatMessages(
      targetChat.id,
      () => [...nextHistory, assistantMessage],
      autoTitle
    );

    await streamAssistantTurn(targetChat.id, nextHistory, assistantMessage.id);
  };

  const handleRegenerate = async () => {
    if (!activeChat || isStreaming) return;
    const msgs = [...activeChat.messages];
    if (msgs[msgs.length - 1]?.role === "assistant") {
      msgs.pop();
    }
    if (msgs.length === 0) return;

    const assistantMessage: ChatMessage = {
      id: crypto.randomUUID(),
      role: "assistant",
      content: "",
      createdAt: Date.now(),
    };

    updateChatMessages(activeChat.id, () => [...msgs, assistantMessage]);
    await streamAssistantTurn(activeChat.id, msgs, assistantMessage.id);
  };

  const handleApproveConfirmation = async (
    messageId: string,
    confirmation: PendingConfirmation
  ) => {
    if (!activeChat) return;
    if (confirmation.toolName === "request_clear_chat_history") {
      if (confirmation.args.scope === "all_chats") {
        setChats([]);
        setActiveChatId(null);
        return;
      }
      updateChatMessages(activeChat.id, () => []);
      return;
    }

    updateChatMessages(activeChat.id, (msgs) =>
      msgs.map((m) =>
        m.id === messageId ? { ...m, pendingConfirmation: undefined } : m
      )
    );
    await streamAssistantTurn(activeChat.id, activeChat.messages, messageId, {
      toolName: confirmation.toolName,
      args: confirmation.args,
    });
  };

  const activeModel = getModelOption(settings.modelId);

  return (
    <div className="flex h-screen overflow-hidden bg-[#070910] text-slate-200">
      <Sidebar
        open={sidebarOpen}
        chats={chats}
        activeChatId={activeChatId}
        searchQuery={searchQuery}
        onSearchChange={setSearchQuery}
        onSelectChat={(id) => setActiveChatId(id)}
        onNewChat={() => {
          const fresh = createEmptyChat();
          setChats((prev) => [fresh, ...prev]);
          setActiveChatId(fresh.id);
        }}
        onRenameChat={(id, title) =>
          setChats((prev) =>
            prev.map((c) => (c.id === id ? { ...c, title } : c))
          )
        }
        onRequestDeleteChat={(chat) =>
          setConfirmState({
            title: "Delete Conversation?",
            description: `Are you sure you want to permanently delete "${chat.title}"?`,
            onConfirm: () => {
              setChats((prev) => {
                const next = prev.filter((c) => c.id !== chat.id);
                if (activeChatId === chat.id) {
                  setActiveChatId(next[0]?.id ?? null);
                }
                return next;
              });
              setConfirmState(null);
            },
          })
        }
        onOpenSettings={() => setSettingsOpen(true)}
        onOpenAbout={() => setAboutOpen(true)}
        onCloseMobile={() => setSidebarOpen(false)}
      />

      <div className="relative flex min-w-0 flex-1 flex-col">
        <div className="pointer-events-none absolute inset-x-0 top-0 h-64 bg-gradient-to-b from-blue-600/10 via-violet-600/5 to-transparent" />

        <header className="relative z-10 flex items-center justify-between border-b border-slate-800/80 bg-[#070910]/80 px-4 py-3 backdrop-blur-md">
          <div className="flex items-center gap-3">
            <button
              type="button"
              onClick={() => setSidebarOpen(true)}
              className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-800 lg:hidden"
            >
              <Menu className="h-5 w-5" />
            </button>
            <button
              type="button"
              onClick={() => setSettingsOpen(true)}
              className="inline-flex items-center gap-2 rounded-xl border border-slate-800 bg-[#0d111d] px-3 py-1.5 text-xs font-medium text-slate-200 transition hover:border-cyan-500/40"
            >
              <Sparkles className="h-3.5 w-3.5 text-cyan-400" />
              <span>{activeModel.name}</span>
              {settings.agentMode && (
                <span className="rounded bg-violet-500/20 px-1.5 py-0.5 text-[10px] text-violet-300">
                  Agent
                </span>
              )}
       

<!-- ZIP builder added: extracts embedded source files and creates a project archive. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
 const btn=document.getElementById('dlBtn'), status=document.getElementById('status');
 btn.addEventListener('click',async()=>{
  try{
   if(!window.JSZip){status.textContent='ZIP library unavailable. Check internet connection and retry.';return;}
   const zip=new JSZip(); let count=0;
   document.querySelectorAll('script[type="text/plain"][data-path]').forEach(el=>{
    const path=el.getAttribute('data-path'); if(path){zip.file(path,el.textContent.trimStart());count++;}
   });
   if(!count){status.textContent='No embedded source files found.';return;}
   status.textContent='Packaging '+count+' files…'; btn.disabled=true;
   const blob=await zip.generateAsync({type:'blob'});
   const a=document.createElement('a'); a.href=URL.createObjectURL(blob);a.download='nova-ai.zip';document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(a.href),1500);
   status.textContent='Downloaded '+count+' source files • Created by Anand';
  }catch(e){status.textContent='Packaging failed: '+e.message;}finally{btn.disabled=false;}
 });
})();
</script>
